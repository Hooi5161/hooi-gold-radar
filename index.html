<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><link rel="manifest" href="manifest.json"><title>HOOI Gold Radar</title><style>body{margin:0;background:#0b0d12;color:#f6f7f9;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#151922;border:1px solid #2a303c;border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.price{font-size:42px;font-weight:800}.muted{color:#9ca6b7;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sig{text-align:center;background:#11151d;border-radius:15px;padding:14px}.dot{width:34px;height:34px;border-radius:50%;display:inline-block;border:4px solid #fff;margin:8px}.green{background:#30d158}.red{background:#ff453a}.yellow{background:#ffd60a}.big{font-size:22px;font-weight:800}canvas{width:100%;height:220px;background:#0f131a;border-radius:12px}.status{padding:8px 12px;border-radius:999px;background:#232936;font-size:12px}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}button{background:#232936;color:white;border:1px solid #343c4a;border-radius:10px;padding:10px}</style></head><body><main class="wrap"><div class="row"><div><b>HOOI GOLD RADAR</b><div class="muted">XAU/USD · 免费数据版</div></div><span id="feed" class="status">连接中</span></div><section class="card"><div class="row"><div><div class="muted">黄金现货 USD/oz</div><div id="price" class="price">--</div><div id="updated" class="muted">等待真实行情</div></div><div id="mainDot" class="dot yellow"></div></div><canvas id="chart" width="700" height="220"></canvas></section><section class="card"><b>多周期雷达</b><div id="signals" class="grid" style="margin-top:12px"></div></section><section class="card"><div class="row"><div><div class="muted">当前提示</div><div id="action" class="big">🟡 等待</div></div><div id="score" class="big">--</div></div><p id="reason" class="muted">真实数据不足时不会制造交易信号。</p></section><section class="card muted">数据源：XAUS 免费公开 API。约30秒缓存，属于指示性现货中间价，并非你的券商可成交报价。此版本不收月费。方向雷达是技术分析，不保证未来走势。</section></main><script>const P='https://xaus.com/api/v1/spot?compact=1',H='https://xaus.com/api/v1/intraday?symbol=xau&hours=48';let hist=[];const periods=['15分钟','30分钟','1小时','6小时','24小时','10天','1个月','3个月'];function draw(){let c=document.querySelector('#chart'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(hist.length<2)return;let a=hist.slice(-100),mn=Math.min(...a),mx=Math.max(...a),s=Math.max(.01,mx-mn);x.strokeStyle='#d8b44a';x.lineWidth=3;x.beginPath();a.forEach((v,i)=>{let px=10+i*(c.width-20)/(a.length-1),py=10+(mx-v)/s*(c.height-20);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}function classify(delta){if(Math.abs(delta)<.0007)return['yellow','等待',52];return delta>0?['green','偏上',Math.min(88,58+Math.round(delta*5000))]:['red','偏下',Math.min(88,58+Math.round(-delta*5000))]}function renderSignals(){let box=document.querySelector('#signals'),n=hist.length,last=hist[n-1]||0;let look=[8,15,30,60,180,300,500,700];box.innerHTML=periods.map((p,i)=>{let j=Math.max(0,n-1-look[i]),base=hist[j]||last,d=base?(last-base)/base:0,[col,t,sc]=classify(d);return `<div class="sig"><div class="muted">${p}</div><span class="dot ${col}"></span><div><b>${t}</b></div><div class="muted">${sc}/100</div></div>`}).join('');let base=hist[Math.max(0,n-31)]||last,d=base?(last-base)/base:0,[col,t,sc]=classify(d);document.querySelector('#mainDot').className='dot '+col;document.querySelector('#action').textContent=(col==='green'?'🟢':col==='red'?'🔴':'🟡')+' '+t;document.querySelector('#score').textContent=sc+'/100';document.querySelector('#reason').textContent=col==='yellow'?'短线方向不够一致，等待。':'短线价格动量已形成，但仍需结合你的交易平台报价与风险控制。'}async function loadHistory(){try{let r=await fetch(H);let j=await r.json();let arr=j.data||j.points||j.series||j; if(Array.isArray(arr)){hist=arr.map(v=>Number(v.price??v.close??v.value)).filter(Number.isFinite);draw();renderSignals()}}catch(e){}}async function tick(){try{let r=await fetch(P,{cache:'no-store'});if(!r.ok)throw 0;let j=await r.json(),p=Number(j.spot_usd_oz??j.xau?.price);if(!Number.isFinite(p))throw 0;document.querySelector('#price').textContent=p.toFixed(2);document.querySelector('#updated').textContent='更新时间 '+(j.updated_at?new Date(j.updated_at).toLocaleString():'刚刚');document.querySelector('#feed').textContent='真实行情';hist.push(p);if(hist.length>800)hist.shift();draw();renderSignals()}catch(e){document.querySelector('#feed').textContent='行情暂不可用';}}loadHistory().finally(tick);setInterval(tick,30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
